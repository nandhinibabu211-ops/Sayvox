<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sayvox overlay</title>
    <link rel="stylesheet" href="/src/overlay/overlay.css" />
  </head>
  <body>
    <div id="overlay" data-state="hidden" role="status" aria-live="polite">
      <span class="dot" aria-hidden="true"></span>
      <span id="label"></span>
      <button
        id="mode"
        type="button"
        class="badge"
        hidden
        title="Change mode for this dictation"
      ></button>
      <p id="text"></p>
      <button id="action" type="button" hidden></button>
    </div>
    <script type="module" src="/src/overlay/main.ts"></script>
  </body>
</html>
