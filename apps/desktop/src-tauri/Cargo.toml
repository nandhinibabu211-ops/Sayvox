[package]
name = "sayvox-desktop"
version = "0.1.0"
description = "Sayvox hold-to-talk dictation for Windows"
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
name = "sayvox_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
tauri = { version = "2.12.7", features = [] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
