[package]
name = "sayvox-desktop"
version = "0.1.0"
description = "Sayvox hold-to-talk dictation for Windows"
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
name = "sayvox_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
tauri = { version = "2.12.7", features = ["tray-icon"] }
tauri-plugin-deep-link = "2.6.3"
tauri-plugin-opener = "2.7.3"
tauri-plugin-single-instance = { version = "2.5.5", features = ["deep-link"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tiny_http = "0.12.0"
uuid = { version = "1.29.3", features = ["v4"] }
# Windows Credential Manager only (ADR-010).
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }
cpal = "0.18.2"
tauri-plugin-updater = "2.12.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
