# Local dev services only. Staging/prod use Cloud SQL and Memorystore (ADR-006).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sayvox
      POSTGRES_PASSWORD: sayvox
      POSTGRES_DB: sayvox
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sayvox -d sayvox"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
