openapi: 3.1.0
info:
  title: Sayvox API
  version: 1.0.0
  description: >
    Stateless REST + SSE backend for Sayvox. Every /v1 route requires a Bearer JWT
    unless marked `security: []`. Transcript text is never persisted or logged.
servers:
  - url: https://sayvox-api-<hash>-<region>.a.run.app
    description: production — temporary Cloud Run URL (exact URL known after first deploy; ADR-009)
  - url: http://localhost:8787
    description: local dev
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      security: []
      summary: Liveness
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string, const: ok } } }

  /v1/client-config:
    get:
      security: []
      summary: Kill switch, minimum version, rollout flags
      parameters:
        - in: header
          name: x-client-version
          schema: { type: string }
        - in: header
          name: x-install-id
          schema: { type: string }
      responses:
        "200":
          description: Config
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClientConfig" }

  /v1/session/start:
    post:
      summary: Quota check, create session, mint single-use Scribe token
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                prefetch: { type: boolean, default: false }
      responses:
        "200":
          description: Session started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionStartResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "402": { $ref: "#/components/responses/Error" }
        "426": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /v1/rewrite:
    post:
      summary: Stream a rewrite of the transcript (Server-Sent Events)
      description: See contracts/rewrite-sse.md for event formats.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RewriteRequest" }
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream:
              schema: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/session/{id}/end:
    post:
      summary: Close a session with client timings
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SessionEndRequest" }
      responses:
        "204": { description: Closed (idempotent) }
        "404": { $ref: "#/components/responses/Error" }

  /v1/settings:
    get:
      summary: Get settings
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettingsResponse" }
    put:
      summary: Update settings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Settings" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettingsResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /v1/dictionary:
    get:
      summary: List custom terms
      responses:
        "200":
          description: Terms
          content:
            application/json:
              schema:
                type: object
                properties:
                  terms: { type: array, items: { $ref: "#/components/schemas/DictionaryTerm" } }
                  limit: { type: integer }
    post:
      summary: Add a term
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [term]
              properties:
                term: { type: string, minLength: 1, maxLength: 64 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DictionaryTerm" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/dictionary/{id}:
    delete:
      summary: Remove a term
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }

  /v1/usage:
    get:
      summary: Usage today and this month, plan limits, subscription and upgrade offers
      description: Quotas use UTC days and calendar months (data-model.md Redis keys).
      responses:
        "200":
          description: Usage
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsageResponse" }

  /v1/billing/checkout:
    post:
      summary: Create a Razorpay subscription and return its hosted payment link (ADR-003)
      description: >
        The link (short_url) is opened in the system browser and expires after 24 h.
        The plan only changes when the signed webhook reports the subscription active.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [planId]
              properties:
                planId: { type: string, maxLength: 32 }
      responses:
        "200":
          description: Hosted payment link
          content:
            application/json:
              schema: { type: object, required: [url], properties: { url: { type: string, format: uri } } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /v1/billing/cancel:
    post:
      summary: Cancel the active subscription at the end of the paid period
      responses:
        "200":
          description: Cancelled at period end; the plan stays until then
          content:
            application/json:
              schema:
                type: object
                properties:
                  currentPeriodEnd: { type: string, format: date-time, nullable: true }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /v1/billing/webhook:
    post:
      security: []
      summary: Razorpay subscription webhook
      description: >
        Verified with X-Razorpay-Signature (hex HMAC-SHA256 of the raw body with the webhook
        secret). Idempotent on X-Razorpay-Event-Id; events older than the last one applied to a
        subscription are ignored (Razorpay does not guarantee order). Payloads are never stored.
        subscription.* events update the subscription and the user's plan: active and
        pending (payment retry grace) grant the plan; halted, paused, cancelled, completed and
        expired do not.
      parameters:
        - in: header
          name: X-Razorpay-Signature
          required: true
          schema: { type: string }
        - in: header
          name: X-Razorpay-Event-Id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Accepted (applied, duplicate, stale, unknown or ignored)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [applied, duplicate, stale, unknown, ignored] }
        "400": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /v1/account:
    delete:
      summary: Delete account and all user data
      description: >
        Idempotent and safe to retry. Removes the user's rows (cascade), Redis keys and
        Identity Platform account; the caller's ID token is refused afterwards (401).
        409 while a live subscription still has to be cancelled.
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /v1/telemetry:
    post:
      summary: Client crash reports and text-free product events
      description: >
        Relayed to Error Reporting (crashes) and Cloud Logging → BigQuery (events).
        Only enum, number and boolean fields are accepted; free-text fields are rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  maxItems: 50
                  items:
                    oneOf:
                      - $ref: "#/components/schemas/TelemetryEvent"
                      - $ref: "#/components/schemas/CrashReport"
      responses:
        "202": { description: Accepted }
        "400": { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Error:
      description: Error envelope
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Mode: { type: string, enum: [dictation, prompt, email] }
    Preset: { type: string, enum: [fastest, balanced, cheapest] }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code:
              type: string
              enum: [UNAUTHENTICATED, FORBIDDEN, VALIDATION_FAILED, NOT_FOUND, CONFLICT,
                     QUOTA_EXCEEDED, RATE_LIMITED, CLIENT_OUTDATED, KILL_SWITCH,
                     PROVIDER_UNAVAILABLE, INTERNAL]
            message: { type: string }
            requestId: { type: string }
            resetAt: { type: string, format: date-time }
    ClientConfig:
      type: object
      properties:
        minClientVersion: { type: string }
        latestClientVersion: { type: string }
        killSwitch: { type: boolean }
        killSwitchMessage: { type: string }
        rolloutPercent: { type: integer, minimum: 0, maximum: 100 }
        inRollout: { type: boolean, description: "This install (x-install-id) is in the staged rollout" }
        updateRequired:
          type: boolean
          description: Present when x-client-version was sent; true if below minClientVersion
    SessionStartResponse:
      type: object
      required: [sessionId, scribeToken, keyterms, maxSessionSeconds, expiresAt]
      properties:
        sessionId: { type: string, format: uuid }
        scribeToken: { type: string }
        expiresAt: { type: string, format: date-time }
        keyterms: { type: array, items: { type: string } }
        languageHint: { type: string, nullable: true }
        maxSessionSeconds: { type: integer }
    RewriteRequest:
      type: object
      required: [sessionId, transcript, mode, targetApp]
      properties:
        sessionId: { type: string, format: uuid }
        transcript: { type: string, maxLength: 20000 }
        mode: { $ref: "#/components/schemas/Mode" }
        targetApp: { type: string, maxLength: 200 }
        threadContext: { type: string, maxLength: 8000, description: "Email mode only; never stored" }
    SessionEndRequest:
      type: object
      required: [audioSeconds, insertResult, timings]
      properties:
        audioSeconds: { type: number, minimum: 0 }
        mode: { $ref: "#/components/schemas/Mode" }
        targetApp: { type: string }
        insertResult: { type: string, enum: [inserted, raw_fallback, discarded, failed] }
        timings:
          type: object
          required: [sttCommitMs, releaseToInsertMs]
          properties:
            sttCommitMs: { type: integer }
            ttftMs: { type: integer }
            releaseToInsertMs: { type: integer }
        scribeRetried: { type: boolean }
        clientVersion: { type: string }
    Settings:
      type: object
      properties:
        preset: { $ref: "#/components/schemas/Preset" }
        defaultMode: { $ref: "#/components/schemas/Mode" }
        appModeOverrides:
          type: object
          additionalProperties: { $ref: "#/components/schemas/Mode" }
        insertMode: { type: string, enum: [auto, review] }
        languageHint: { type: string, nullable: true, enum: [auto, en, en-IN, hinglish, null], description: "null = auto-detect" }
        hotkey: { type: string, enum: [Ctrl+Shift, Ctrl+Alt, Alt+Shift, Ctrl+Win, Shift+Win] }
    SettingsResponse:
      allOf:
        - { $ref: "#/components/schemas/Settings" }
        - type: object
          properties:
            plan:
              type: object
              description: What the user's plan allows (presets outside allowedPresets are shown locked).
              properties:
                id: { type: string }
                allowedPresets: { type: array, items: { $ref: "#/components/schemas/Preset" } }
                dictionaryLimit: { type: integer }
    DictionaryTerm:
      type: object
      properties:
        id: { type: string, format: uuid }
        term: { type: string }
        createdAt: { type: string, format: date-time }
    TelemetryEvent:
      type: object
      required: [kind, name, at]
      additionalProperties: false
      properties:
        kind: { type: string, const: event }
        name: { type: string, enum: [dictation_started, dictation_inserted, mode_changed, fallback_used, quota_hit] }
        at: { type: string, format: date-time }
        mode: { $ref: "#/components/schemas/Mode" }
        durationMs: { type: integer }
        clientVersion: { type: string, maxLength: 32 }
        os: { type: string, enum: [windows10, windows11] }
    CrashReport:
      type: object
      required: [kind, at, clientVersion, os, errorCode]
      additionalProperties: false
      properties:
        kind: { type: string, const: crash }
        at: { type: string, format: date-time }
        clientVersion: { type: string, maxLength: 32 }
        os: { type: string, enum: [windows10, windows11] }
        errorCode: { type: string, maxLength: 64, pattern: "^[A-Z0-9_]+$" }
        module: { type: string, enum: [hotkey, audio, scribe, rewrite, insert, overlay, settings, updater, other] }
        stack: { type: string, maxLength: 8000, description: "Symbolicated frames only; scrubbed of string literals client-side and server-side" }
    UsageResponse:
      allOf:
        - $ref: "#/components/schemas/Usage"
        - type: object
          required: [planName, subscription, upgrades, billingAvailable]
          properties:
            planName: { type: string }
            subscription:
              type: object
              nullable: true
              properties:
                status: { type: string, enum: [active, past_due, cancelled, incomplete, halted] }
                currentPeriodEnd: { type: string, format: date-time, nullable: true }
                cancelAtPeriodEnd: { type: boolean }
            upgrades:
              type: array
              items:
                type: object
                properties:
                  planId: { type: string }
                  name: { type: string }
                  priceCents: { type: integer }
                  currency: { type: string }
                  dailyCapMinutes: { type: integer }
                  monthlyMinutes: { type: integer }
            billingAvailable: { type: boolean }
    Usage:
      type: object
      properties:
        planId: { type: string }
        todayMinutes: { type: number }
        dailyCapMinutes: { type: integer }
        periodMinutes: { type: number }
        monthlyMinutes: { type: integer }
        dailyResetAt: { type: string, format: date-time }
        periodResetAt: { type: string, format: date-time }
